[package]
name = "slackless-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
slackless-types.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing.workspace = true
futures.workspace = true
# `rustls-no-provider` keeps the rustls TLS stack (and the platform verifier) without pulling
# aws-lc-sys; `install_default_crypto_provider` installs the `ring` provider reqwest then needs.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "multipart", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
bytes = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
wiremock = "0.6"

[lints]
workspace = true
