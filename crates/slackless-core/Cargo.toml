[package]
name = "slackless-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
slackless-types.workspace = true
slackless-api.workspace = true
slackless-rtm.workspace = true
slackless-store.workspace = true
slackless-auth.workspace = true
slackless-huddle.workspace = true
dirs = "7"
# Same html5ever/rcdom the GUI already links through gpui-kit: keep in lockstep or cargo adds a
# second copy.
html5ever = "0.27"
markup5ever_rcdom = "0.3"
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
url.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# Both already in the tree (via reqwest and via rusqlite): the media fetcher's shared buffers
# and its LRU.
bytes = "1"
hashlink = "0.12"
sha2 = "0.10"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic", "api-24"] }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "test-util"] }
wiremock = "0.6"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# The integration tests in `tests/` link these libraries without `cfg(test)`.
slackless-core = { path = ".", features = ["test-support"] }
slackless-api = { workspace = true, features = ["test-support"] }

[features]
# Helpers that only tests call (the deterministic hash embedder, unpaced indexing, canvas and
# mrkdwn round-trip helpers), for this crate's `tests/` and the GUI's and CLI's test builds.
test-support = []

[lints]
workspace = true
