[package]
name = "slackless-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
slackless-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
rusqlite = { version = "0.43", features = ["bundled"] }
flate2 = "1.1"

[dev-dependencies]
# `busy_handler` lets the `merge_conversation` test interleave a second writer deterministically.
rusqlite = { version = "0.43", features = ["hooks"] }
# The integration tests in `tests/` link this library without `cfg(test)`.
slackless-store = { path = ".", features = ["test-support"] }

[features]
# `Store::list_outbox_for_channel`, so the integration tests in `tests/` can inspect one
# channel's queue. Never enabled outside test builds.
test-support = []

[lints]
workspace = true
