[package]
name = "slackless-auth"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
slackless-types.workspace = true
slackless-api.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

# Config-dir discovery for the on-disk session store.
dirs = "5"
wry = { version = "0.57.3", optional = true }
tao = { version = "0.37.3", optional = true }

[dev-dependencies]
tokio = { workspace = true }
wiremock = "0.6"
tempfile = "3"

[features]
# The embedded WebKit sign-in window (`embedded_sign_in`). Front-ends that open it enable this;
# the core and its tests do not need a windowing stack.
webview = ["dep:wry", "dep:tao"]
