name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deny:
    name: Dependency Audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check dependencies (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2

  test:
    name: Test Workspace (macOS arm64)
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-18
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ci-nightly-v1

      - name: Ensure native build tools
        shell: bash
        run: |
          set -euo pipefail
          command -v cmake >/dev/null || brew install cmake
          command -v pkg-config >/dev/null || brew install pkg-config

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check

      - name: Lint workspace (clippy)
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace -- -D warnings
          cargo clippy --workspace --tests -- -D warnings

      - name: Run workspace tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --profile ci-test --workspace

      - name: Build workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo build --profile ci-test --workspace
