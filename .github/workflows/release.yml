name: Release macOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  test:
    name: Test Workspace (macOS arm64)
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ci-v2

      - name: Ensure native build tools
        shell: bash
        run: |
          set -euo pipefail
          command -v cmake >/dev/null || brew install cmake
          command -v pkg-config >/dev/null || brew install pkg-config

      - name: Run workspace tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --profile ci-test --workspace

  build:
    name: Build macOS Artifacts (arm64)
    runs-on: macos-15
    outputs:
      version: ${{ steps.ver.outputs.version }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute CalVer version (YYYY.MM.DD-xx)
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          DATE_PREFIX="$(date -u +%Y.%m.%d)"
          LAST_NUM="$(git tag -l "${DATE_PREFIX}-*" \
            | awk -F- '{print $2}' \
            | grep -E '^[0-9]+$' \
            | sort -n \
            | tail -n 1 || true)"
          if [[ -z "$LAST_NUM" ]]; then
            NEXT_NUM=1
          else
            NEXT_NUM=$((10#$LAST_NUM + 1))
          fi
          VERSION="$(printf '%s-%02d' "$DATE_PREFIX" "$NEXT_NUM")"
          echo "Computed release version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-v2

      - name: Ensure native build tools
        shell: bash
        run: |
          set -euo pipefail
          command -v cmake >/dev/null || brew install cmake
          command -v pkg-config >/dev/null || brew install pkg-config

      - name: Import macOS signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERT_P12:-}" ]]; then
            echo "MACOS_CERT_P12 secret not set; falling back to ad-hoc signing"
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/slackless-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/slackless-cert.p12"

          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          EXISTING_KEYCHAINS=()
          while IFS= read -r line; do
            k="$(printf '%s' "$line" | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//')"
            [[ -n "$k" ]] && EXISTING_KEYCHAINS+=("$k")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING_KEYCHAINS[@]}"
          security find-identity -p codesigning "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Build Slackless.app & CLI
        env:
          SLACKLESS_VERSION: ${{ steps.ver.outputs.version }}
          CARGO_BUILD_JOBS: "4"
        shell: bash
        run: |
          set -euo pipefail
          # Builds and signs both slackless-gui and slackless CLI inside Slackless.app/Contents/MacOS/
          ./scripts/bundle-macos.sh --release

      - name: Package DMG, tarballs & checksums
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          DIST="dist"
          rm -rf "$DIST"
          mkdir -p "$DIST"

          # 1. Drag-to-Applications DMG (retry on transient macOS Spotlight "Resource busy")
          DMG_STAGE="$(mktemp -d)"
          cp -R target/bundle/Slackless.app "$DMG_STAGE/Slackless.app"
          ln -s /Applications "$DMG_STAGE/Applications"
          for attempt in 1 2 3 4 5; do
            if hdiutil create \
              -volname "Slackless ${VERSION}" \
              -srcfolder "$DMG_STAGE" \
              -ov \
              -format UDZO \
              "${DIST}/Slackless-${VERSION}-macos-arm64.dmg"; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "hdiutil create failed after 5 attempts" >&2
              exit 1
            fi
            echo "hdiutil create busy (attempt $attempt/5); retrying in $((attempt * 3))s..." >&2
            sleep $((attempt * 3))
          done
          rm -rf "$DMG_STAGE"

          # 2. Compressed .app tarball (for scripted installs / auto-updater)
          tar -C target/bundle -czf "${DIST}/Slackless-${VERSION}-macos-arm64.app.tar.gz" Slackless.app

          # 3. Standalone CLI tarball
          tar -C target/release -czf "${DIST}/slackless-cli-${VERSION}-macos-arm64.tar.gz" slackless

          # 4. SHA-256 checksums
          (cd "$DIST" && shasum -a 256 * > SHA256SUMS.txt)
          ls -lh "$DIST"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          retention-days: 1

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [test, build]
    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Generate grouped release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          PREV_TAG="$(git tag --sort=-creatordate | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]+$' | head -n 1 || true)"
          if [[ -n "$PREV_TAG" ]]; then
            RANGE="${PREV_TAG}..${GITHUB_SHA}"
          else
            RANGE="${GITHUB_SHA}"
          fi

          python3 - "$RANGE" "$PREV_TAG" "$VERSION" "$NOTES_FILE" <<'PY'
          import subprocess, sys

          rev_range, prev_tag, version, out_path = sys.argv[1:5]
          raw = subprocess.check_output(
              ["git", "log", "--no-merges", "--format=%h%x09%s", rev_range],
              text=True,
          ).splitlines()

          groups = {
              "Features": [],
              "Bug Fixes": [],
              "Performance": [],
              "Maintenance & Other": [],
          }

          for line in raw:
              if "\t" not in line:
                  continue
              sha, subj = line.split("\t", 1)
              low = subj.lower()
              entry = f"- {subj} (`{sha}`)"
              if low.startswith("feat"):
                  groups["Features"].append(entry)
              elif low.startswith("fix"):
                  groups["Bug Fixes"].append(entry)
              elif low.startswith("perf"):
                  groups["Performance"].append(entry)
              else:
                  groups["Maintenance & Other"].append(entry)

          lines = []
          for heading in ("Features", "Bug Fixes", "Performance", "Maintenance & Other"):
              items = groups[heading]
              if items:
                  lines.append(f"### {heading}")
                  lines.extend(items)
                  lines.append("")

          if not lines:
              lines.append("Maintenance release.\n")

          if prev_tag:
              lines.append(
                  f"**Full Changelog**: https://github.com/ankarhem/slackless/compare/{prev_tag}...{version}\n"
              )

          lines.append("### Install or Update (macOS Apple Silicon)")
          lines.append("```sh")
          lines.append("curl -fsSL https://raw.githubusercontent.com/ankarhem/slackless/main/scripts/install-macos.sh | sh")
          lines.append("# or, if already installed:")
          lines.append("slackless update --restart")
          lines.append("```")

          with open(out_path, "w", encoding="utf-8") as f:
              f.write("\n".join(lines).strip() + "\n")
          PY

          cat "$NOTES_FILE"
          echo "file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            dist/* \
            --target "$GITHUB_SHA" \
            --title "Slackless ${VERSION}" \
            --notes-file "$NOTES_FILE"
