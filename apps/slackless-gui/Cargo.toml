[package]
name = "slackless-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
slackless-core.workspace = true
slackless-platform.workspace = true
# `HttpClient::send`'s error type (GPUI's image loader).
anyhow.workspace = true
tracing.workspace = true
# The sign-in window (`--sign-in` helper process).
slackless-auth = { workspace = true, features = ["webview"] }
gpui-kit = "0.11.0"
# Nightly aarch64 ICE workaround (docs/research/gpui-kit-guide.md section 15).
pathfinder_simd = { version = "0.5", features = ["pf-no-simd"] }
emojis = "0.9"
# The zoom platform wrapper (zoom.rs) names these types from GPUI's platform traits.
raw-window-handle = "0.6"
smallvec = "1"
# Bare `http(s)://` autolinking in message text.
linkify = "0.12"
# Double-click word selection in every script (UAX #29 word boundaries).
unicode-segmentation = "1.13"
# Word-level diffs between message revisions (revision history dialog).
similar = "2"
# Named (IANA) time zones for the display clock's manual time zone preference.
jiff = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Already in Cargo.lock via gpui-pre; used for zero-copy CVPixelBuffer -> window.paint_surface.
objc2-core-foundation = "0.3.2"
objc2-core-video = "0.3.2"

[dev-dependencies]
# Headless window tests: drag selection and link clicks over rendered message text. The
# engine's test-support only (the kit's would also resolve its optional gpui-fast backend,
# which needs a proptest this environment's registry lacks).
gpui = { version = "=0.3.14", package = "gpui-pre", features = ["test-support"] }
# The deterministic hash embedder the semantic-search tests index with.
slackless-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
