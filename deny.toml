# cargo-deny configuration for slackless
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "warn"
# Flag unmaintained direct workspace dependencies without failing on unfixable
# transitive crates inside gpui-kit / wry / webrtc / nokhwa.
unmaintained = "workspace"
ignore = [
    { id = "RUSTSEC-2026-0594", reason = "Transitive cookie 0.18.2 via wry; slackless never forks without exec and does not use cookie PrivateJar. Remove after `cargo update -p cookie` (>=0.18.3)." },
    { id = "RUSTSEC-2026-0592", reason = "Pinned url 2.5.8 in Cargo.lock (stack overflow in Url::origin on nested blob: URLs). Remove after `cargo update -p url` (>=2.5.9)." },
    { id = "RUSTSEC-2026-0459", reason = "Bundled SQLite CVE-2026-119375 in libsqlite3-sys 0.30.1 via rusqlite 0.32.1 (local-only crafted DB+WAL vector; slackless opens only its own local cache DB). Fix requires breaking upgrade to rusqlite >=0.41." },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "IJG",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
