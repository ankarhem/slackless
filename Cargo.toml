[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# GPUI renders every frame through its dependencies: optimize them even in dev builds, and
# our own crates lightly, so `cargo run` stays smooth while rebuilds stay quick.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Fast headless test profile for CI: disables -O3 on dependencies and DWARF debuginfo so
# workspace tests compile quickly and keep CI caches compact.
[profile.ci-test]
inherits = "dev"
opt-level = 0
debug = 0

[profile.ci-test.package."*"]
opt-level = 0

[profile.release]
lto = "thin"
strip = "debuginfo"

[workspace.dependencies]
slackless-types = { path = "crates/slackless-types" }
slackless-api = { path = "crates/slackless-api" }
slackless-rtm = { path = "crates/slackless-rtm" }
slackless-store = { path = "crates/slackless-store" }
slackless-auth = { path = "crates/slackless-auth" }
slackless-huddle = { path = "crates/slackless-huddle" }
slackless-platform = { path = "crates/slackless-platform" }
slackless-core = { path = "crates/slackless-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
url = "2"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
